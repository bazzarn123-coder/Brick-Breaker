<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikachu Pong Brick Breaker!</title>
    <style>
        :root {
            --bg-sky: #1a1a2e;
            --grid-bg: #16213e;
            --pikachu-yellow: #ffcc00;
            --electric-orange: #ff9900;
            --pokeball-red: #ff3333;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-sky);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.4rem;
            color: var(--pikachu-yellow);
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
            letter-spacing: 1px;
        }

        #score-board {
            font-size: 1.05rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #game-container {
            position: relative;
            background: var(--grid-bg);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 3px solid var(--pikachu-yellow);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #0f3460, #16213e);
            cursor: pointer;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid var(--pokeball-red);
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6);
            z-index: 10;
        }

        button {
            background-color: var(--pikachu-yellow);
            color: #000;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.3);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>⚡ POKÉ PONG BREAKER ⚡</h1>
    <div id="score-board">Score: <span id="score">0</span> | Lives: <span id="lives">3</span> | Level: <span id="level">1</span></div>

    <div id="game-container">
        <!-- Expanded canvas size for a larger play area -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="game-over">
            <h2 id="end-title" style="color:var(--pokeball-red); margin-top:0;">⚡ Game Over ⚡</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const levelEl = document.getElementById("level");
        const gameOverEl = document.getElementById("game-over");
        const finalScoreEl = document.getElementById("final-score");
        const endTitleEl = document.getElementById("end-title");

        // Game State
        let score = 0;
        let lives = 3;
        let level = 1;
        let isGameOver = false;

        // Base speed configurations
        const baseSpeed = 4.5;
        let currentSpeed = baseSpeed;

        // Paddle definition (Slightly adjusted wider for larger play area)
        const paddle = {
            width: 90,
            height: 14,
            x: canvas.width / 2 - 45,
            y: canvas.height - 40,
        };

        // Ball definition
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            radius: 8,
            dx: 3,
            dy: -3
        };

        // Expanded Brick configuration to match wider canvas layout
        const brickConfig = {
            rows: 5,
            cols: 7,
            width: 46,
            height: 22,
            padding: 8,
            offsetTop: 40,
            offsetLeft: 21
        };

        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let r = 0; r < brickConfig.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    let type = r % 4; 
                    bricks[r][c] = {
                        x: 0,
                        y: 0,
                        status: 1, // 1 = active, 0 = broken
                        type: type 
                    };
                }
            }
        }

        const brickColors = ['#ffcc00', '#ff6600', '#3399ff', '#66cc99']; // Pikachu, Charmander, Squirtle, Bulbasaur

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 60;
            
            // Set vector direction matching current scaled speed
            let angle = (Math.random() * 0.6 - 0.3) * Math.PI; // slight randomized angle
            ball.dx = currentSpeed * Math.sin(angle);
            ball.dy = -currentSpeed * Math.cos(angle);
        }

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            currentSpeed = baseSpeed;
            isGameOver = false;
            
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            levelEl.innerText = level;
            gameOverEl.style.display = "none";
            
            initBricks();
            resetBall();
            loop();
        }

        // Touch and Mouse sliding controls
        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            let relativeX = clientX - rect.left;
            paddle.x = relativeX - paddle.width / 2;

            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }

        window.addEventListener("mousemove", (e) => handleMove(e.clientX));
        window.addEventListener("touchmove", (e) => {
            if (e.touches.length > 0) {
                handleMove(e.touches[0].clientX);
            }
        }, { passive: true });

        // Level Up & Speed Up mechanism
        function nextLevel() {
            level++;
            levelEl.innerText = level;
            
            // Increase ball speed by 5% per level completed
            currentSpeed *= 1.05;
            
            initBricks();
            resetBall();
        }

        function collisionDetection() {
            let activeBricksCount = 0;
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        activeBricksCount++;
                        let brickX = brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding);
                        let brickY = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
                        
                        b.x = brickX;
                        b.y = brickY;

                        // Intersection detection
                        if (
                            ball.x + ball.radius > brickX &&
                            ball.x - ball.radius < brickX + brickConfig.width &&
                            ball.y + ball.radius > brickY &&
                            ball.y - ball.radius < brickY + brickConfig.height
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = score;
                        }
                    }
                }
            }

            // Check if all bricks cleared -> Advance Level
            if (activeBricksCount === 0) {
                nextLevel();
            }
        }

        function update() {
            if (isGameOver) return;

            // Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collisions (Left / Right)
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.dx = -ball.dx;
            } else if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.dx = -ball.dx;
            }

            // Wall collision (Top)
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.dy = -ball.dy;
            }

            // Paddle collision
            if (
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width
            ) {
                let hitPoint = ball.x - (paddle.x + paddle.width / 2);
                
                // Maintain vector speed magnitude while curving based on hit location
                let normalizedHit = hitPoint / (paddle.width / 2);
                let currentMag = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                
                ball.dx = normalizedHit * (currentMag * 0.75);
                ball.dy = -Math.abs(Math.sqrt(Math.max(0, currentMag * currentMag - ball.dx * ball.dx)));
                
                // Safety guard against flat horizontal bounces
                if (Math.abs(ball.dy) < 1.5) ball.dy = ball.dy < 0 ? -1.5 : 1.5;
            }

            // Bottom boundary check (Lose Life)
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                livesEl.innerText = lives;
                if (lives <= 0) {
                    isGameOver = true;
                    endTitleEl.style.color = "#ff3333";
                    endTitleEl.innerText = "⚡ Game Over ⚡";
                    finalScoreEl.innerText = score;
                    gameOverEl.style.display = "block";
                } else {
                    resetBall();
                }
            }

            collisionDetection();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bricks
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        let brickX = brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding);
                        let brickY = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
                        
                        ctx.fillStyle = brickColors[b.type];
                        ctx.shadowColor = brickColors[b.type];
                        ctx.shadowBlur = 6;
                        ctx.fillRect(brickX, brickY, brickConfig.width, brickConfig.height);
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // Draw Paddle
            ctx.fillStyle = "#ffcc00";
            ctx.shadowColor = "#ffcc00";
            ctx.shadowBlur = 10;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff3333";
            ctx.fill();
            ctx.closePath();
        }

        function loop() {
            update();
            if (!isGameOver) {
                draw();
                requestAnimationFrame(loop);
            }
        }

        // Start initialization
        initBricks();
        resetBall();
        loop();
    </script>
</body>
</html>
